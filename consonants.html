<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thai Consonants</title>
  <meta name="description" content="Thai consonants by class, with tone rules and audio">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Thai+Looped:wght@400;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
      const f = localStorage.getItem('thaiFont'); if (f) document.documentElement.dataset.thaiFont = f;
    } catch (e) {}
  </script>
</head>
<body>
  <nav class="topnav" aria-label="Sections">
    <div class="topnav-inner">
      <a class="tab" href="./">Vowels <span class="thai">สระ</span></a>
      <a class="tab" href="consonants.html" aria-current="page">Consonants <span class="thai">พยัญชนะ</span></a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
    </div>
  </nav>
  <main>
    <header>
      <h1>Thai Consonants <span class="thai">พยัญชนะ</span></h1>
      <p class="hint">Tap a letter to hear its name. The class decides the tone.</p>
      <div class="font-picker">
        <span id="font-label">Thai font</span>
        <div class="segmented" role="group" aria-labelledby="font-label">
          <button type="button" data-font="looped" style="--sample-font: 'Noto Sans Thai Looped'"><span class="sample" lang="th">กอ</span>Looped</button>
          <button type="button" data-font="looped-serif" style="--sample-font: 'Noto Serif Thai'"><span class="sample" lang="th">กอ</span>Serif</button>
          <button type="button" data-font="modern" style="--sample-font: 'Noto Sans Thai'"><span class="sample" lang="th">กอ</span>Modern</button>
        </div>
      </div>
    </header>

    <section aria-labelledby="classes-h">
      <h2 id="classes-h" class="visually-hidden">Consonants by class</h2>
      <div id="classes"></div>
      <div id="letter-detail" class="detail detail-sticky" aria-live="polite" hidden></div>
    </section>

    <section aria-labelledby="tones-h">
      <h2 id="tones-h">Tone rules</h2>
      <p class="hint">Tap a syllable to hear its tone. Non-stop finals: ง น ม ย ว · Stop finals: ก ด บ (and letters that sound like them).</p>
      <div class="table-scroll">
        <table id="tone-table" class="tone-table"></table>
      </div>
      <div id="tone-detail" class="detail detail-sticky" aria-live="polite" hidden></div>
    </section>

    <footer>
      <label class="slow-toggle"><input type="checkbox" id="slow"> Slow playback</label>
    </footer>
  </main>

  <script src="consonants-data.js"></script>
  <script src="common.js"></script>
  <script src="consonants.js"></script>
</body>
</html>
