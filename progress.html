<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thai Progress</title>
  <meta name="description" content="Charts of your Words and Sentences quiz progress">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Thai+Looped:wght@400;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
      const f = localStorage.getItem('thaiFont'); if (f) document.documentElement.dataset.thaiFont = f;
      if (localStorage.getItem('navMenu') === 'on') document.documentElement.dataset.navMenu = 'on';
    } catch (e) {}
  </script>
</head>
<body>
  <nav class="topnav" aria-label="Sections">
    <div class="topnav-inner">
      <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-expanded="false" aria-controls="nav-tabs" aria-label="Menu"></button>
      <div class="tabs" id="nav-tabs">
        <a class="tab" href="./">Vowels <span class="thai">สระ</span></a>
        <a class="tab" href="consonants.html">Consonants <span class="thai">พยัญชนะ</span></a>
        <a class="tab" href="tones.html">Tones <span class="thai">วรรณยุกต์</span></a>
        <a class="tab" href="words.html">Words <span class="thai">คำศัพท์</span></a>
        <a class="tab" href="sentences.html">Sentences <span class="thai">ประโยค</span></a>
        <a class="tab" href="progress.html" aria-current="page">Progress <span class="thai">ความคืบหน้า</span></a>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
    </div>
  </nav>
  <main>
    <header>
      <h1>Progress <span class="thai">ความคืบหน้า</span></h1>
      <p class="hint">How your Words and Sentences quizzes are going. Hover or tap a bar for its numbers.</p>
    </header>

    <div id="progress"><p class="muted">Loading…</p></div>

    <footer>
      <label class="slow-toggle"><input type="checkbox" id="slow"> Slow playback</label>
      <label class="slow-toggle"><input type="checkbox" id="nav-menu-pref"> Menu button on phones</label>
    </footer>
  </main>

  <script src="lib/sql-wasm.js"></script>
  <script src="vocab-data.js"></script>
  <script src="common.js"></script>
  <script src="store.js"></script>
  <script src="srs.js"></script>
  <script src="charts.js"></script>
  <script src="progress.js"></script>
</body>
</html>
